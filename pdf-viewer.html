<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Popup PDF Viewer</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        color: #1f2933;
        background-color: #f5f7fa;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        padding: 0.9rem 1.4rem;
        font-size: 1rem;
        color: white;
        background: #2563eb;
        cursor: pointer;
        transition: filter 150ms ease-in-out, transform 150ms ease-in-out;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
      }

      button:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(1px);
      }

      .note {
        margin-top: 1rem;
        color: #4b5563;
        font-size: 0.9rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <button id="openPdfBtn">Open PDF in Popup</button>
        <p class="note">
          Update <code>PDF_URL</code> with any PDF you'd like to preview; the
          popup hides built-in download controls where the browser allows.
        </p>
    </main>

    <script>
      /**
       * Replace this with your own PDF path or an absolute URL.
       * For local development, keep the PDF file in the same folder and
       * use a relative path like "./assets/my-doc.pdf".
       */
      const PDF_URL = "./sample.pdf";

      /**
       * Opens a centered popup window and injects a lightweight PDF viewer.
       * @param {string} pdfUrl
       */
      function openPdfPopup(pdfUrl = PDF_URL) {
        const width = 960;
        const height = 720;
        const top = Math.max(0, (screen.height - height) / 2);
        const left = Math.max(0, (screen.width - width) / 2);

        const features = [
          `width=${width}`,
          `height=${height}`,
          `top=${top}`,
          `left=${left}`,
          "menubar=no",
          "toolbar=no",
          "location=no",
          "status=no",
          "resizable=yes",
          "scrollbars=yes",
        ].join(",");

        const popup = window.open("", "pdfPopupWindow", features);

        if (!popup) {
          alert(
            "Your browser blocked the popup. Please allow popups for this site."
          );
          return;
        }

        // Basic HTML template for the popup viewer.
        popup.document.write(`<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PDF Preview</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111827;
      }
      iframe {
        border: none;
        width: 100%;
        height: 100%;
        background: #1f2937;
      }
    </style>
  </head>
    <body>
      <iframe src="${encodeURI(
        pdfUrl
      )}#toolbar=0&navpanes=0&scrollbar=0&view=FitH" title="PDF preview"></iframe>
    </body>
</html>`);

        popup.document.close();
      }

      document
        .getElementById("openPdfBtn")
        .addEventListener("click", () => openPdfPopup());
    </script>
  </body>
</html>
