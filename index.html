<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive Video Orientation Demo</title>
    <style>
      :root {
        --video-rotate: 0deg;
        --video-scale: 1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #f8fafc;
        background: #020617;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at top, rgba(15, 23, 42, 0.85), rgba(2, 6, 23, 0.9));
        z-index: -1;
      }

      .background-video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center;
        transform: rotate(var(--video-rotate)) scale(var(--video-scale));
        transition: transform 0.35s ease;
        filter: brightness(0.6);
        z-index: -2;
        background: #000;
      }

      main {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 3rem 1.5rem;
      }

      .content {
        text-align: center;
        backdrop-filter: blur(8px);
        background: rgba(2, 6, 23, 0.55);
        border: 1px solid rgba(248, 250, 252, 0.25);
        border-radius: 1.25rem;
        padding: clamp(1.5rem, 4vw, 3rem);
        max-width: 640px;
        width: min(90vw, 640px);
        box-shadow: 0 25px 55px rgba(0, 0, 0, 0.45);
      }

      h1 {
        font-size: clamp(1.6rem, 4vw, 2.75rem);
        margin-bottom: 1rem;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        opacity: 0.9;
      }

      @media (max-width: 640px) {
        :root {
          --video-rotate: 90deg;
          --video-scale: 1.7778; /* compensate for 16:9 -> 9:16 */
        }
      }
    </style>
  </head>
  <body>
    <video class="background-video" autoplay muted loop playsinline>
      <source src="sample-video.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <main>
      <section class="content">
        <h1>Responsive Video Background</h1>
        <p>
          The same MP4 spans the entire viewport. On narrow screens (≤ 640px), a media query rotates
          it into a portrait orientation to keep the scene immersive without swapping files. Drop in
          your own video by replacing <code>sample-video.mp4</code>.
        </p>
      </section>
    </main>
  </body>
</html>
