<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive Video Orientation Demo</title>
    <style>
      :root {
        --video-rotate: 0deg;
        --video-scale: 1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #10131a, #050608 65%);
        color: #f1f5f9;
        padding: 2rem 1rem;
      }

      h1 {
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        margin-bottom: 1rem;
        text-align: center;
      }

      .demo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        width: min(900px, 90vw);
      }

      .video-frame {
        width: min(900px, 85vw);
        aspect-ratio: 16 / 9;
        border-radius: 1rem;
        overflow: hidden;
        position: relative;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.25);
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center;
        transform: rotate(var(--video-rotate)) scale(var(--video-scale));
        transition: transform 0.35s ease;
        background: #000;
      }

      .hint {
        font-size: 0.95rem;
        text-align: center;
        opacity: 0.85;
      }

      @media (max-width: 640px) {
        :root {
          --video-rotate: 90deg;
          --video-scale: 1.7778; /* compensate for 16:9 -> 9:16 */
        }

        .video-frame {
          aspect-ratio: 9 / 16;
          max-height: 80vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <h1>Landscape-to-Portrait Video via Media Query</h1>
      <div class="video-frame">
        <video autoplay muted loop playsinline controls>
          <source src="sample-video.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
      <p class="hint">
        Shrink the viewport below 640px to rotate the same MP4 into a portrait layout.
        Replace <code>sample-video.mp4</code> with your own asset.
      </p>
    </main>
  </body>
</html>
