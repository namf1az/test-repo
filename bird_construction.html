<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hardhat Bird at Work</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #8dd0ff 0%, #c2e6ff 40%, #f2dfc6 100%);
    }

    .scene {
      padding: 1.5rem;
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    canvas {
      border-radius: 1rem;
      width: min(80vw, 600px);
      height: min(53vw, 400px);
      max-width: 600px;
      max-height: 400px;
      background: #f7efe3;
    }

    .hud {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hud .status {
      font-weight: 600;
      color: #444;
      font-size: 1rem;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.65rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #f9a826, #f47b1f);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div class="scene">
    <canvas id="siteCanvas" width="600" height="400"></canvas>
    <div class="hud">
      <div class="status" id="statusLabel">Bird is building...</div>
      <button id="toggleBtn" type="button">Pause</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("siteCanvas");
    const ctx = canvas.getContext("2d");
    const statusLabel = document.getElementById("statusLabel");
    const toggleBtn = document.getElementById("toggleBtn");

    const bird = {
      x: 260,
      y: 230,
      bobPhase: 0,
    };

    const hammer = {
      angle: -0.2,
      direction: 1,
      speed: 0.05,
    };

    const sparks = [];
    const dustPuffs = [];

    const crane = {
      swing: 0,
      speed: 0.01,
    };

    let lastTimestamp = 0;
    let running = true;

    function drawBackground() {
      // Sky gradient already via canvas CSS; draw sun and skyline
      ctx.save();
      ctx.fillStyle = "#ffd27d";
      ctx.beginPath();
      ctx.arc(520, 60, 40, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d5c5b2";
      for (let i = 0; i < 5; i++) {
        const w = 60 + Math.random() * 60;
        const h = 120 + Math.random() * 80;
        const x = i * 120 + Math.random() * 30;
        ctx.fillRect(x, canvas.height - h - 100, w, h);
      }

      ctx.fillStyle = "#ccb9a0";
      ctx.fillRect(0, canvas.height - 90, canvas.width, 90);
      ctx.restore();
    }

    function drawSiteEquipment() {
      ctx.save();
      ctx.strokeStyle = "#7a5f3f";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(80, canvas.height - 90);
      ctx.lineTo(80, canvas.height - 200);
      ctx.stroke();

      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(80, canvas.height - 200);
      ctx.lineTo(230, canvas.height - 200);
      ctx.stroke();

      const hookX = 230 + Math.sin(crane.swing) * 30;
      const hookY = canvas.height - 200 + 80;
      ctx.beginPath();
      ctx.moveTo(230, canvas.height - 200);
      ctx.lineTo(hookX, hookY);
      ctx.stroke();

      ctx.fillStyle = "#555";
      ctx.fillRect(hookX - 10, hookY, 20, 15);

      ctx.fillStyle = "#c26925";
      ctx.fillRect(340, canvas.height - 150, 140, 20); // beam
      ctx.fillRect(360, canvas.height - 130, 100, 20); // second beam
      ctx.restore();
    }

    function drawBird() {
      ctx.save();
      const bob = Math.sin(bird.bobPhase) * 5;
      const x = bird.x;
      const y = bird.y + bob;

      // body
      ctx.fillStyle = "#4a8fbd";
      ctx.beginPath();
      ctx.ellipse(x, y, 60, 45, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = "#3c7395";
      ctx.beginPath();
      ctx.ellipse(x - 25, y, 30, 20, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // tail
      ctx.beginPath();
      ctx.moveTo(x - 55, y - 15);
      ctx.lineTo(x - 90, y - 25);
      ctx.lineTo(x - 70, y);
      ctx.closePath();
      ctx.fill();

      // head
      ctx.fillStyle = "#4a8fbd";
      ctx.beginPath();
      ctx.arc(x + 40, y - 35, 30, 0, Math.PI * 2);
      ctx.fill();

      // hardhat base
      ctx.fillStyle = "#ffcc33";
      ctx.beginPath();
      ctx.ellipse(x + 40, y - 43, 35, 20, 0, Math.PI, 0, true);
      ctx.fill();

      // hardhat top
      ctx.beginPath();
      ctx.arc(x + 40, y - 50, 24, Math.PI, 0);
      ctx.fill();

      // hardhat brim
      ctx.fillRect(x + 10, y - 38, 60, 10);

      // eye
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(x + 52, y - 40, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.arc(x + 54, y - 40, 4, 0, Math.PI * 2);
      ctx.fill();

      // beak
      ctx.fillStyle = "#f5a623";
      ctx.beginPath();
      ctx.moveTo(x + 65, y - 38);
      ctx.lineTo(x + 90, y - 32);
      ctx.lineTo(x + 65, y - 26);
      ctx.closePath();
      ctx.fill();

      // legs
      ctx.strokeStyle = "#c26e28";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + 20, y + 45);
      ctx.lineTo(x + 20, y + 70);
      ctx.moveTo(x + 40, y + 45);
      ctx.lineTo(x + 40, y + 70);
      ctx.stroke();

      // safety vest highlight
      ctx.strokeStyle = "#ffcf5c";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(x, y, 42, Math.PI / 4, (Math.PI / 4) * 3);
      ctx.stroke();

      ctx.restore();
    }

    function drawHammer() {
      ctx.save();
      const pivotX = bird.x + 60;
      const pivotY = bird.y + Math.sin(bird.bobPhase) * 5 - 5;
      ctx.translate(pivotX, pivotY);
      ctx.rotate(hammer.angle);

      // Handle
      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(0, -4, 80, 8);

      // Head
      ctx.fillStyle = "#555";
      ctx.fillRect(70, -10, 26, 20);

      ctx.restore();
    }

    function drawBricks() {
      ctx.save();
      const baseY = canvas.height - 50;
      ctx.fillStyle = "#c35b2d";
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 5; col++) {
          const offset = row % 2 === 0 ? 0 : 20;
          ctx.fillRect(150 + col * 40 + offset, baseY - row * 20, 36, 18);
        }
      }
      ctx.restore();
    }

    function spawnSpark(x, y) {
      sparks.push({
        x,
        y,
        life: 1,
        vx: (Math.random() - 0.5) * 2,
        vy: -1 - Math.random(),
      });
    }

    function spawnDust(x, y) {
      dustPuffs.push({
        x,
        y,
        size: 5 + Math.random() * 8,
        life: 1,
      });
    }

    function drawParticles(delta) {
      ctx.save();
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.life -= delta * 0.0015;
        s.x += s.vx * delta * 0.1;
        s.y += s.vy * delta * 0.1;
        if (s.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = s.life;
        ctx.fillStyle = "#ffd966";
        ctx.fillRect(s.x, s.y, 3, 3);
      }

      for (let j = dustPuffs.length - 1; j >= 0; j--) {
        const d = dustPuffs[j];
        d.life -= delta * 0.0008;
        d.size += delta * 0.01;
        if (d.life <= 0) {
          dustPuffs.splice(j, 1);
          continue;
        }
        ctx.globalAlpha = d.life * 0.6;
        ctx.fillStyle = "#d8c1a3";
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function update(delta) {
      bird.bobPhase += delta * 0.003;
      hammer.angle += hammer.direction * hammer.speed * delta * 0.06;

      if (hammer.angle > 0.4) {
        hammer.direction = -1;
      } else if (hammer.angle < -0.6) {
        hammer.direction = 1;
        spawnSpark(bird.x + 135, bird.y + 25);
        spawnDust(bird.x + 100, bird.y + 40);
      }

      crane.swing += crane.speed * delta * 0.08;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawSiteEquipment();
      drawBricks();
      drawBird();
      drawHammer();
    }

    function loop(timestamp) {
      if (!running) return;
      const delta = timestamp - lastTimestamp || 16;
      lastTimestamp = timestamp;
      update(delta);
      render();
      drawParticles(delta);
      requestAnimationFrame(loop);
    }

    toggleBtn.addEventListener("click", () => {
      running = !running;
      toggleBtn.textContent = running ? "Pause" : "Resume";
      statusLabel.textContent = running ? "Bird is building..." : "Bird is on break.";
      if (running) {
        lastTimestamp = performance.now();
        requestAnimationFrame(loop);
      }
    });

    // Kick off a few dust clouds so it isn't empty.
    for (let i = 0; i < 5; i++) {
      spawnDust(200 + i * 30, canvas.height - 60);
    }

    requestAnimationFrame((ts) => {
      lastTimestamp = ts;
      loop(ts);
    });
  </script>
</body>
</html>
