<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Screen Background Video</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      #bg-video {
        position: fixed;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -1;
        transform: translate(-50%, -50%);
        object-fit: cover;
        background: #000;
      }

      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <video
      id="bg-video"
      autoplay
      muted
      loop
      playsinline
      poster="fallback.jpg"
    >
      <source src="background.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <main class="content">
      <div>
        <h1>Full Screen Background Video</h1>
        <p>Drop your MP4 in place of <code>background.mp4</code> and enjoy.</p>
      </div>
    </main>
  </body>
</html>
